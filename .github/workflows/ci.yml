name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  format:
    name: 整形チェック
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: clang-format 20 をインストール
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y clang-format-20
          clang-format-20 --version
      - name: 整形を確認
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format-20 --dry-run --Werror

  build:
    name: ビルドとテスト (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: LLVM 20 をインストール (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y clang-tidy-20 ninja-build pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-20 100

      - name: LLVM 20 をインストール (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm --version=20.1.8 --allow-downgrade -y --no-progress
          choco install ninja -y --no-progress
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: ツールのバージョン
        run: |
          clang++ --version
          clang-tidy --version
          cmake --version
          ninja --version

      - name: vcpkg の場所を設定
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: vcpkg のバイナリキャッシュ
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-

      - name: キャッシュ用ディレクトリ
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: 構成
        run: cmake --preset ci

      - name: ビルド
        run: cmake --build --preset ci

      - name: テスト
        run: ctest --preset ci
