name: CI

on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN の権限はリポジトリの読み取りのみ
permissions:
  contents: read

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
  # apt.llvm.org の署名鍵のフィンガープリント（https://apt.llvm.org/ に掲載）
  LLVM_KEY_FINGERPRINT: 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
  LLVM_VERSION: 20

jobs:
  format:
    name: 整形チェック
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: LLVM の apt リポジトリを登録
        run: .github/scripts/add-llvm-apt-repo.sh

      - name: clang-format をインストール
        run: |
          sudo apt-get install -y "clang-format-${LLVM_VERSION}"
          "clang-format-${LLVM_VERSION}" --version

      - name: 整形を確認
        run: git ls-files '*.cpp' '*.hpp' | xargs "clang-format-${LLVM_VERSION}" --dry-run --Werror

  build:
    name: ビルドとテスト (${{ matrix.os }}, ${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
        # ci: 警告をエラー扱い + clang-tidy、asan: AddressSanitizer（docs/adr/0017-run-asan-in-ci.md）
        preset: [ci, asan]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ツールをインストール (Linux)
        if: runner.os == 'Linux'
        run: |
          .github/scripts/add-llvm-apt-repo.sh
          # raylib → glfw の X11 / Wayland 依存と、vcpkg が autotools でビルドする依存（pthread-stubs など）
          sudo apt-get install -y \
            "clang-${LLVM_VERSION}" "clang-tidy-${LLVM_VERSION}" ninja-build pkg-config \
            autoconf autoconf-archive automake libtool \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols
          # runner に入っている /usr/bin/clang++（古い版）より優先されるよう、LLVM 20 の bin を PATH の先頭に置く
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"

      - name: ツールをインストール (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm --version=20.1.8 --allow-downgrade -y --no-progress
          choco install ninja -y --no-progress
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: ツールのバージョン
        run: |
          clang++ --version
          clang-tidy --version
          cmake --version
          ninja --version

      - name: vcpkg の場所を設定
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      # キャッシュは main への push でのみ保存する。PR からは復元のみ（キャッシュの改ざんを防ぐ）
      - name: vcpkg のバイナリキャッシュを復元
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-

      - name: キャッシュ用ディレクトリ
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: 構成
        run: cmake --preset ${{ matrix.preset }}

      - name: ビルド
        run: cmake --build --preset ${{ matrix.preset }}

      - name: テスト
        run: ctest --preset ${{ matrix.preset }}

      # 依存ライブラリのビルド結果はプリセットによらず同じため、ci のジョブだけが保存する
      - name: vcpkg のバイナリキャッシュを保存
        if: matrix.preset == 'ci' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
